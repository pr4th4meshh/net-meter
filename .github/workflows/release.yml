# Push a tag like v1.0.0 and GitHub builds NetMeter.app and attaches it to a Release.
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: ./build.sh
      - name: Zip
        run: ditto -c -k --keepParent build/NetMeter.app NetMeter.zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" NetMeter.zip install.sh --title "NetMeter $GITHUB_REF_NAME" --generate-notes
